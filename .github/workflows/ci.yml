name: CI — lint, tests and build

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint / Tests / Build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: family_admin
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: family_rewards_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family_admin -d family_rewards_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://family_admin:ci_only@localhost:5432/family_rewards_test?schema=public
      TEST_DATABASE_URL: postgresql://family_admin:ci_only@localhost:5432/family_rewards_test?schema=public
      JWT_SECRET: ci-only-not-for-production-32-character-key
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Exercise fresh database bootstrap and restart
        run: |
          set -euo pipefail
          node --input-type=module -e 'import {Client} from "pg"; const c=new Client({connectionString:process.env.DATABASE_URL}); await c.connect(); await c.query("CREATE DATABASE family_rewards_fresh"); await c.end();'
          export DATABASE_URL="postgresql://family_admin:ci_only@localhost:5432/family_rewards_fresh?schema=public"
          node scripts/migrate-safe.mjs
          npx prisma migrate status
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
          node scripts/migrate-safe.mjs
          npx prisma migrate status
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Reject interrupted migration and unknown database
        run: |
          set -euo pipefail
          export DATABASE_URL="postgresql://family_admin:ci_only@localhost:5432/family_rewards_fresh?schema=public"
          npx prisma db execute --stdin <<'SQL'
          INSERT INTO "_prisma_migrations" (id, checksum, migration_name, started_at, applied_steps_count)
          VALUES ('ci-interrupted', 'ci-only', 'ci_interrupted_migration', CURRENT_TIMESTAMP, 0);
          SQL
          if node scripts/migrate-safe.mjs > "$RUNNER_TEMP/interrupted.log" 2>&1; then
            echo "Unexpected success on interrupted migration"; exit 1
          fi
          cat "$RUNNER_TEMP/interrupted.log"
          grep -F "Unfinished migration detected" "$RUNNER_TEMP/interrupted.log"
          node --input-type=module -e 'import {Client} from "pg"; const c=new Client({connectionString:process.env.DATABASE_URL}); await c.connect(); await c.query("CREATE DATABASE family_rewards_unknown"); await c.end();'
          export DATABASE_URL="postgresql://family_admin:ci_only@localhost:5432/family_rewards_unknown?schema=public"
          npx prisma db execute --stdin <<'SQL'
          CREATE TABLE unrelated_data (id integer PRIMARY KEY);
          INSERT INTO unrelated_data VALUES (42);
          SQL
          if node scripts/migrate-safe.mjs > "$RUNNER_TEMP/unknown.log" 2>&1; then
            echo "Unexpected success on unknown database"; exit 1
          fi
          cat "$RUNNER_TEMP/unknown.log"
          grep -F "Unrecognised non-empty database" "$RUNNER_TEMP/unknown.log"
          node --input-type=module -e 'import {Client} from "pg"; const c=new Client({connectionString:process.env.DATABASE_URL}); await c.connect(); const r=await c.query("SELECT id FROM unrelated_data"); if(r.rows.length!==1 || r.rows[0].id!==42) throw Error("Existing data changed"); await c.end();'

      - name: Exercise legacy-to-ledger PostgreSQL migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/new-avatar-migrations"
          mv prisma/migrations/20261123093000_avatar_ledgers "$RUNNER_TEMP/new-avatar-migrations/"
          mv prisma/migrations/20261123094500_ledger_baselines_and_debts "$RUNNER_TEMP/new-avatar-migrations/"
          mv prisma/migrations/20261123110000_avatar_level_milestones "$RUNNER_TEMP/new-avatar-migrations/"
          mv prisma/migrations/20261123120000_child_achievement_celebrations "$RUNNER_TEMP/new-avatar-migrations/"
          mv prisma/migrations/20261124210000_persistent_pin_lockout "$RUNNER_TEMP/new-avatar-migrations/"
          mv prisma/migrations/20261124223000_avatar_purchase_history "$RUNNER_TEMP/new-avatar-migrations/"
          npx prisma migrate deploy
          # Reproduce the previous db-push installation with its latest legacy columns.
          cp prisma/schema.prisma "$RUNNER_TEMP/avatar-schema-current.prisma"
          node scripts/ci-prepare-legacy-schema.mjs
          npx prisma db push
          cp "$RUNNER_TEMP/avatar-schema-current.prisma" prisma/schema.prisma
          npx prisma generate
          npx prisma db execute --file integration/fixtures/legacy-avatar-data.sql
          mv "$RUNNER_TEMP/new-avatar-migrations"/* prisma/migrations/
          node scripts/migrate-safe.mjs
          npx tsx integration/verify-avatar-migration.ts
          npx prisma migrate status
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: PostgreSQL integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-database-password
        run: docker compose config --quiet

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production Docker image (no push)
        run: docker build --target runner -t family-rewards:ci .

      - name: Fresh Docker Compose startup and restart
        env:
          POSTGRES_PASSWORD: ci-only-database-password
          JWT_SECRET: ci-only-not-for-production-32-character-key
          COMPOSE_PROJECT_NAME: family-rewards-ci
        run: |
          set -euo pipefail
          docker compose up -d --build --wait --wait-timeout 180
          curl --fail --silent --show-error http://localhost:3000/api/health
          docker compose restart app
          docker compose up -d --wait --wait-timeout 180
          curl --fail --silent --show-error http://localhost:3000/api/health

      - name: Collect Compose logs
        if: failure()
        run: docker compose logs --no-color
        env:
          POSTGRES_PASSWORD: ci-only-database-password
          JWT_SECRET: ci-only-not-for-production-32-character-key
          COMPOSE_PROJECT_NAME: family-rewards-ci

      - name: Clean disposable CI deployment
        if: always()
        run: docker compose down -v
        env:
          POSTGRES_PASSWORD: ci-only-database-password
          JWT_SECRET: ci-only-not-for-production-32-character-key
          COMPOSE_PROJECT_NAME: family-rewards-ci
