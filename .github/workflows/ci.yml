name: CI — lint, tests and build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint / Tests / Build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: family_admin
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: family_rewards
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family_admin -d family_rewards"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://family_admin:ci_only@localhost:5432/family_rewards?schema=public
      JWT_SECRET: ci-only-not-for-production-32-character-key
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Synchronize CI PostgreSQL schema
        run: npx prisma db push

      - name: PostgreSQL integration tests
        run: npx vitest run --config vitest.integration.config.mts

      - name: Production build
        run: npm run build

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-database-password
        run: docker compose config --quiet

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production Docker image (no push)
        run: docker build --target runner -t family-rewards:ci .
