name: Regenerate dependency lockfile

on:
  push:
    branches:
      - dependabot/npm_and_yarn/production-dependencies-55f57f6564
    paths:
      - .github/workflows/refresh-dicebear-lock.yml
      - package.json
      - src/components/AvatarDisplay.tsx
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate lockfile for DiceBear v10"
            git push
          fi
