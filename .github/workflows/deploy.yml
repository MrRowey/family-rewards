name: Website build and deploy
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the website to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: family-rewards-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/gh-pages' && github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
