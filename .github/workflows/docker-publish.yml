name: Build and Publish Docker Image

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mrrowey/family-rewards:latest
            ghcr.io/mrrowey/family-rewards:sha-${{ github.sha }}

      - name: Build and push fresh-install schema image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: deps
          push: true
          tags: |
            ghcr.io/mrrowey/family-rewards:init
            ghcr.io/mrrowey/family-rewards:init-sha-${{ github.sha }}