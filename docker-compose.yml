services:
  backend:
    build: ./backend
    container_name: family-rewards-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./database:/app/database
      - ./backend/.env:/app/.env
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/database/family.db
      - PORT=3001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: family-rewards-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:3001

networks:
  default:
    name: family-rewards-network
