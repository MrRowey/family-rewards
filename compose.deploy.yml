# Portable GHCR deployment for Docker Compose and Portainer.
# For a FRESH database, run the one-time schema initialisation described in docs/self-hosting.md.
# Do not automatically synchronise an existing database on image updates.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-family_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-family_rewards}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-family_admin} -d ${POSTGRES_DB:-family_rewards}"]
      interval: 5s
      timeout: 3s
      retries: 10

  uploads_permissions:
    image: busybox:1.37
    user: "0:0"
    restart: "no"
    command: ["chown", "-R", "65532:65532", "/app/uploads"]
    volumes:
      - uploads_data:/app/uploads

  app:
    image: ${FAMILY_REWARDS_IMAGE:-ghcr.io/mrrowey/family-rewards:latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-family_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-family_rewards}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "const req=require('http').get('http://127.0.0.1:3000/api/health',r=>{r.resume();process.exit(r.statusCode===200?0:1)});req.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      uploads_permissions:
        condition: service_completed_successfully

volumes:
  postgres_data:
  uploads_data:
